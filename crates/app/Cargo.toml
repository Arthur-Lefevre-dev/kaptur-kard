[package]
name = "captureview"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "CaptureView desktop application"
rust-version.workspace = true

[[bin]]
name = "captureview"
path = "src/main.rs"

[features]
default = []
# Optional DirectShow scaffolding (capture crate). Does not change the default MF path.
directshow = ["capture/directshow"]
# Keep a console window on Windows release builds (default release uses windows_subsystem).
console = []

[dependencies]
capture = { workspace = true, features = ["mock"] }
audio = { workspace = true }
render = { workspace = true }
metrics = { workspace = true }

winit = { workspace = true }
wgpu = { workspace = true }
egui = { workspace = true }
egui-wgpu = { workspace = true }
egui-winit = { workspace = true }

tracing = { workspace = true }
tracing-subscriber = { workspace = true }
tracing-appender = { workspace = true }
anyhow = { workspace = true }
crossbeam-channel = { workspace = true }
parking_lot = { workspace = true }
pollster = { workspace = true }
serde = { workspace = true }
toml = { workspace = true }
sys-locale = { workspace = true }
arboard = { version = "3" }
discord-rich-presence = "1.1.0"
image = { version = "0.25", default-features = false, features = ["png"] }

[build-dependencies]
winres = "0.1"
